<footer class="site-footer">
  <div class="shell footer-grid">
    <div class="footer-intro">
      <a class="footer-brand" href="#top">FASHIONSTORE</a>
      <p>Prendas para vestir cada versión de ti.</p>
    </div>
    <nav aria-label="Comprar">
      <h2>Comprar</h2>
      <a routerLink="/catalogo">Novedades</a>
      <a routerLink="/catalogo" [queryParams]="{ seccion: 'HOMBRE' }">Hombre</a>
      <a routerLink="/catalogo" [queryParams]="{ seccion: 'MUJER' }">Mujer</a>
      <a routerLink="/catalogo" [queryParams]="{ seccion: 'UNISEX' }">Unisex</a>
    </nav>
    <nav aria-label="Ayuda">
      <h2>Ayuda</h2>
      <button type="button">Preguntas frecuentes</button>
      <button type="button">Contacto</button>
      <button type="button">Sucursales</button>
    </nav>
    <nav aria-label="Mi cuenta">
      <h2>Mi cuenta</h2>
      <button type="button">Iniciar sesión</button>
      <button type="button">Mis reservas</button>
      <button type="button">Mis compras</button>
    </nav>
  </div>
  <div class="shell footer-bottom">
    <p>© {{ year }} FashionStore</p>
    <p>Hecho para vestir tu historia.</p>
  </div>
</footer>
