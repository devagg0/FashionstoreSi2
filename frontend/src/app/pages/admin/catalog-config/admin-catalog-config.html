<main aria-labelledby="catalog-title">
  <h2 id="catalog-title">Configuración de catálogo</h2>
  <p class="intro">Categorías, tallas y colores compartidos por FashionStore.</p>
  <div class="catalog-tabs" role="tablist" aria-label="Catálogos">
    @for (tab of tabs; track tab.id; let index = $index) {
      <button
        type="button"
        role="tab"
        [id]="'tab-' + tab.id"
        [attr.aria-controls]="'panel-' + tab.id"
        [attr.aria-selected]="activeTab() === tab.id"
        [tabIndex]="activeTab() === tab.id ? 0 : -1"
        (click)="selectTab(tab.id)"
        (keydown)="moveTab($event, index)"
      >
        {{ tab.label }}
      </button>
    }
  </div>
  <div
    id="panel-categories"
    role="tabpanel"
    aria-labelledby="tab-categories"
    [hidden]="activeTab() !== 'categories'"
  >
    <app-admin-categories [active]="activeTab() === 'categories'" />
  </div>
  <div
    id="panel-sizes"
    role="tabpanel"
    aria-labelledby="tab-sizes"
    [hidden]="activeTab() !== 'sizes'"
  >
    @if (visited().has('sizes')) {
      <app-admin-sizes [active]="activeTab() === 'sizes'" />
    }
  </div>
  <div
    id="panel-colors"
    role="tabpanel"
    aria-labelledby="tab-colors"
    [hidden]="activeTab() !== 'colors'"
  >
    @if (visited().has('colors')) {
      <app-admin-colors [active]="activeTab() === 'colors'" />
    }
  </div>
</main>
