<article class="style-card">
  <img [src]="image()" [alt]="alt()" [style.object-position]="position()" loading="lazy" />
  <div class="style-card__shade"></div>
  <div class="style-card__content">
    <p>Selección editorial</p>
    <h3>{{ title() }}</h3>
    <a class="button button--light-outline" routerLink="/catalogo" [queryParams]="{ seccion: title() }">
      Explorar
      <span aria-hidden="true">→</span>
    </a>
  </div>
</article>
